<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Copier Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=IBM+Plex+Mono:wght@500&family=Space+Mono&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="./site.css">
<link rel="stylesheet" href="./playground.css">
</head>
<body>
<div class="pg">
  <section class="stage" aria-label="Preview">
    <div class="stage-bar">
      <span class="stage-title">Copier</span>
      <span class="stage-w" id="stage-w"></span>
    </div>
    <div class="stage-canvas" id="canvas">
      <div class="frame" id="frame">
        <div class="cp-stage" id="pv">
          <photo-copier id="copier"></photo-copier>
        </div>
      </div>
    </div>
    <div class="stage-foot">
      <div class="code">
        <div class="code-head">
          <div class="seg seg-sm" role="tablist" id="code-tabs">
            <button type="button" role="tab" aria-selected="true" data-tab="html">HTML</button>
            <button type="button" role="tab" aria-selected="false" data-tab="react">React</button>
          </div>
          <button type="button" class="copy" id="copy">Copy</button>
        </div>
        <pre id="code"></pre>
      </div>
      <div class="events">
        <span class="events-label">Events</span>
        <ol id="events"><li class="empty">Take a copy out of the tray to see events</li></ol>
      </div>
    </div>
  </section>
  <aside class="panel" id="panel" aria-label="Properties"></aside>
</div>
<script type="module" src="./playground.ts"></script>
</body>
</html>
